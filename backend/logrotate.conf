# Log rotation configuration for Indostar application
# This file can be used with logrotate on Linux systems

/path/to/logs/indostar.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 www-data www-data
    sharedscripts
    postrotate
        # Reload application if needed
        # systemctl reload indostar-backend
    endscript
}

/path/to/logs/errors.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 www-data www-data
    sharedscripts
    postrotate
        # Reload application if needed
        # systemctl reload indostar-backend
    endscript
}

# For Docker deployments, consider using Docker's built-in log rotation:
# docker run --log-driver json-file --log-opt max-size=10m --log-opt max-file=5 ...
